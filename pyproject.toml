[project]
name = "repomentor-ai"
version = "1.2.0"
description = "Python projeleri için statik analiz + ücretsiz LLM destekli geliştirme önerileri"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Yunus Emre Sevindik" }]
keywords = ["static-analysis", "code-quality", "taint-analysis", "security", "streamlit", "llm", "python"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Turkish",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
]
dependencies = [
    "streamlit>=1.66,<2",
    "requests>=2.31,<3",
    "python-dotenv>=1.0,<2",
    "radon>=6.0,<7",
    "bandit>=1.8,<2",
    "ruff>=0.8",
    "altair>=5,<7",
    "pandas>=2.0,<3",
]

[project.urls]
Homepage = "https://github.com/yes3760/repomentor-ai"
Repository = "https://github.com/yes3760/repomentor-ai"
Issues = "https://github.com/yes3760/repomentor-ai/issues"
Changelog = "https://github.com/yes3760/repomentor-ai/blob/HEAD/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5"]

[project.scripts]
repomentor = "repomentor.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["repomentor"]
omit = ["repomentor/ui/*"]

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["F", "E4", "E7", "E9", "B", "W6", "I"]
