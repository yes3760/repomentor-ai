name: RepoMentor PR review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The action in this repository reviews its own pull requests.
      - uses: ./
        with:
          min-score: "80"
          max-drop: "3"
